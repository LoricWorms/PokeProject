<h1>Combat Pokémon</h1>

<h2>{{ player.name }} (HP: {{ player_hp }})</h2>
<img src="{{ player.sprites.front_default }}">

<h2>VS</h2>

<h2>{{ enemy.name }} (HP: {{ enemy_hp }})</h2>
<img src="{{ enemy.sprites.front_default }}">

<form method="post">
    {% csrf_token %}
    <button type="submit">⚔ Attaquer</button>
</form>

<a href="{% url 'team' %}">⬅ Retour équipe</a>
